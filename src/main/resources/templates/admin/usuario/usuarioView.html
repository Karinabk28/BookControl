<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header th:replace="~{/fragments/navFragment.html::cabecera}"></header>
  <section class="seccion-panel">
    <h1 class="titulo-vista-usuarios">Lista de Usuarios</h1>

    <table class="tabla-datos">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Fecha de Registro</th>
                <th>Editar</th>
                <th>Borrar</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="usuario : ${listaUsuario}">
                <td th:text="${usuario.nombre}">*</td>
                <td th:text="${usuario.email}">*</td>
                <td th:text="${usuario.fechaRegistro}">*</td>
                <td>
                    <a th:if="${usuario.nombre == 'Admin'}"></a>
                    <a class="enlace-tabla" th:unless="${usuario.nombre == 'Admin'}"
                       th:href="@{/admin/usuarios/editar/{id}(id=${usuario.id})}">Editar</a>
                </td>
                <td>
                    <a th:if="${usuario.nombre == 'Admin'}"></a>
                    <a class="enlace-tabla eliminar" 
                       th:unless="${usuario.nombre == 'Admin'}"
                       th:href="@{/admin/usuarios/borrar/{id}(id=${usuario.id})}">Borrar</a>
                </td>
            </tr>
        </tbody>
    </table>
 <!--AQUI IRA LA PAGINACION-->
    <p id="msg" class="mensaje-info" th:text="${msg}">mensaje</p>
</section>

</body>
</html>
