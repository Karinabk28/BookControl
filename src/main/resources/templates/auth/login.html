<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <div class="formulario-login">
        <h2 class="titulo-formulario">Iniciar Sesión</h2>
        <form th:action="@{/login}" method="post" class="formulario">
            <input type="text" name="username" placeholder="Usuario" class="campo-entrada" required />
            <input type="password" name="password" placeholder="Contraseña" class="campo-entrada" required />
            <button type="submit" class="btn-enviar">Ingresar</button>
        </form>
        <div class="contenedor-enlace">
            <a href="/registro" class="enlace">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>
</body>
</html>
