<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <!--Más adelante para q algn se registre utilizar un patron para q tenga números, letras etc...
    Y no se si añadir un script dnd añadir lo de confirmar pwd-->
    <div class="formulario-registro">
        <h2 class="titulo-formulario">Registrar Usuario</h2>

        <form th:action="@{/registro}" th:object="${usuario}" method="post" class="formulario">
            <label for="nombre" class="etiqueta-formulario">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ingrese su nombre" class="campo-entrada"
                required />

            <label for="email" class="etiqueta-formulario">Email:</label>
            <input type="email" id="email" th:field="*{email}" placeholder="Ingrese su email" class="campo-entrada"
                required />

            <label for="clave" class="etiqueta-formulario">Contraseña:</label>
            <input type="password" id="clave" th:field="*{clave}" placeholder="Ingrese su contraseña"
                class="campo-entrada" required minlength="4"/>
            <button type="submit" class="btn-enviar">Registrar</button>
        </form>
        <div class="contenedor-enlace">
            <a href="/login" class="enlace">¿Ya tienes cuenta? Iniciar sesión</a>
        </div>
    </div>
</body>

</html>
