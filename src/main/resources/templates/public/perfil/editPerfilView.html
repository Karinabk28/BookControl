<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Perfil</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/js.js" defer></script>
</head>

<body>
  <header th:replace="~{/fragments/navFragment.html::cabecera}"></header>

  <main class="perfilContenedor">
    <h1 class="perfilTitulo">Editar Perfil</h1>
    <form th:action="@{/perfil/editar/submit}" th:object="${usuarioForm}" method="post">

      <div class="perfilDato">
        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required />
      </div>

      <div class="perfilDato">
        <label for="clave">Contraseña:</label>
        <input type="password" id="clave" th:field="*{clave}" required />
      </div>
      <div class="perfilDato">
        <label for="confirmarClave">Confirmar Contraseña:</label>
        <input type="password" id="confirmarClave" required />
        <div id="errorConfirmarClave" class="perfilError" style="display:none;"></div>
      </div>

      <button type="submit" class="perfilBoton">Guardar Cambios</button>
    </form>
    <br>
    <a th:href="@{/perfil}" class="botonVolver">Volver</a>
  </main>
  <footer th:replace="~{/fragments/footerFragment.html::pie}"></footer>
</body>

</html>
