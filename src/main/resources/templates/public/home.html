<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        
    </style>
</head>
<body>

<header th:replace="~{/fragments/navFragment.html::cabecera}"></header>

<main class="contenedor-principal">
    <section class="bienvenida">
        <h1>¡Bienvenido, <span th:text="${#authentication.name}">usuario</span>!</h1>
        <p>Explora nuestra biblioteca digital, encuentra inspiración y descubre nuevas historias que te acompañarán siempre.</p>
    </section>
    <section class="buscador">
        <form th:action="@{/libros/buscar}" method="get">
            <input type="text" name="titulo" placeholder="Buscar por título..." required/>
            <button type="submit">Buscar</button>
        </form>
    </section>
    <section class="resultados">
        <div th:if="${mensaje}">
            <p th:text="${mensaje}" class="mensaje-error"></p>
        </div>

        <div th:if="${librosEncontrados}" class="grid-libros">
            <div class="libro" th:each="libro : ${librosEncontrados}">
                <img th:src="@{${libro.portada}}" alt="Portada" class="portada"/>
                <h3 th:text="${libro.titulo}"></h3>
                <p th:text="${libro.autor}"></p>
                <a th:href="@{'/libros/' + ${libro.id}}">Ver más</a>
            </div>
        </div>
    </section>
    <section class="libro-destacado" th:if="${libroDestacado != null}">
        <h2>Recomendación del día</h2>
        <div class="libro">
            <img th:src="${libroDestacado.portada}" alt="Portada del libro" class="portada"/>
            <h3 th:text="${libroDestacado.titulo}">Título</h3>
            <p th:text="${libroDestacado.autor}">Autor</p>
            <p class="descripcion">Una historia que merece ser descubierta. ¡No te la pierdas!</p>
            <a th:href="@{'/libros/' + ${libroDestacado.id}}" class="boton-secundario">Ver más</a>
        </div>
    </section>
    <section class="explorar-catalogo">
        <a th:href="@{/libros}">
            <button class="boton-principal">Explorar el catálogo</button>
        </a>
    </section>
</main>
  <footer th:replace="~{/fragments/footerFragment.html::pie}"></footer>
</body>
</html>
